      - agent_suite
      - agent_case
      - agent_thresholds
      - agent_families
      - read_agent_suite
  - title: "Running and scoring"
    contents:
      - run_benchmark
      - score_slices
      - readiness
      - consistency
      - agent_evidence
  - title: "Comparison and reporting"
    contents:
      - diff_runs
      - report_markdown
  - title: "Graders"
    contents:
      - graders
      - graders_available
      - register_grader
  - title: "Methods"
    contents:
      - as.data.frame.r4agent_suite

footer:
  structure:
    left: developed_by
    right: built_with
